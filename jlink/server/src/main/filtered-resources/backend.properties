url=${dbUrl}?sslmode=disable
user=${dbUser}
password=~${encryptedPasswd}

service=${dbService}
updateService=${updateService}
updateURL=${updateURL}
timeout=30

# the OAuth client the Google ID tokens must be issued for (see the client's backend.properties)
google.clientId=${googleClientId}
