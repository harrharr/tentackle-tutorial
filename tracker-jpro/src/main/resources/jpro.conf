jpro {

  # per-JVM bootstrap: starts the Tentackle web application before the first browser connects
  onFXStartup = com.example.tracker.jpro.TrackerJProBootstrap

  # let the client send its instance id along, so REST calls can be tied to a logged-in UI session
  addInstanceID = true

  logConsole = true

  applications {
    "tracker" = com.example.tracker.jpro.TrackerJProApplication
  }

  # release the pooled upstream session as soon as the browser tab is gone
  closeInstanceStrategy = null
  closeInstanceStrategy {
    long {
      closeOnTabCloseAfter   = 0
      closeOnDisconnectAfter = 60
      closeOnAFKAfter        = -1
      closeOnBackgroundAfter = -1
    }
  }

  # JPro implements preventSystemExit by installing a SecurityManager, which JDK 24+ refuses
  # (System.setSecurityManager always throws, JEP 486). With the default "true" JPro logs
  # "error while applying configuration Install SecurityManager" and exits with code 255.
  # So the guard is simply not available on Java 25 and the rule "nothing in a multi-user JVM
  # may call System.exit" has to be honoured by the application itself.
  preventSystemExit = false
}
