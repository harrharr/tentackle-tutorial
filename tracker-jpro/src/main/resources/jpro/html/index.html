<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Tracker</title>

  <!--
    JPro injects these three imports only into the pages it generates itself (/test/fullscreen/...,
    see com.jpro.internal.server.RouteHTML#imports). Files below jpro/html are served verbatim as
    plain files, so a static page has to pull them in on its own. Without jpro.js the <jpro-app>
    custom element is never upgraded and the browser shows a blank page.
  -->
  <link href="/jpro/img/favicon.png" rel="icon">
  <link rel="stylesheet" type="text/css" href="/jpro/css/jpro.css">
  <script src="/jpro/js/jpro.js" type="text/javascript"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
    }
  </style>
</head>
<body>
  <jpro-app href="/app/tracker" fullscreen="true"></jpro-app>
</body>
</html>
