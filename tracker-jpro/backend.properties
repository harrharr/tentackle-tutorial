
# Connection of the web tier to the middle tier.
#
# Read as a plain file relative to the working directory, which for "mvn jpro:run" is this
# module's basedir. It cannot live in src/main/resources: on the module path Tentackle resolves
# it with FileHelper.class.getResourceAsStream(), which only ever searches the org.tentackle.common
# module. Keep the url in sync with the "dbService" property of the root pom.
#
# The user below is the *technical* user of the web application, not a browser user: the
# application logs in with it at startup and then gets a session per browser user out of the
# multi-user pool. Create it when filling the database.

url=trip://localhost:8888/TrackerServer
user=jpro
password=jpro
